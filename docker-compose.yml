version: "3"

services:
  calex:
    image: shibaobun/calex
    container_name: calex
    restart: always
    environment:
      # HOST must be set!
      # - HOST=your.domain.com
      - DATABASE_URL=ecto://postgres:postgres@calex-db/calex
      # Use `docker run --rm shibaobun/calex /app/priv/random.sh` to generate a secret key base
      # - SECRET_KEY_BASE=change-me-this-is-really-important-seriously-change-it
      # Required in production. 32 random bytes, base64. Generate with
      # `docker run --rm shibaobun/calex /app/priv/cloak_key.sh`.
      # Back up this key. A new value makes stored authenticator secrets unreadable.
      # - CLOAK_KEY=change-me-32-random-bytes-base64
      # uncomment to enable public sign ups, not recommended
      # - REGISTRATION=public
      # Set to true or 1 to run without sending mail. In production, leaving
      # SMTP_HOST, SMTP_USERNAME, and SMTP_PASSWORD unset does the same.
      # - DISABLE_EMAIL=true
      # SMTP host, username, and password must all be set, or all left unset.
      # A partial SMTP setup refuses to boot unless DISABLE_EMAIL is true or 1.
      # - SMTP_HOST=smtp.mailserver.tld
      # optional, default is 587
      # - SMTP_PORT=587
      # - SMTP_USERNAME=username
      # - SMTP_PASSWORD=password
      # optional, default is false
      # - SMTP_SSL=false
      # optional, default is no-reply@$HOST
      # - EMAIL_FROM=no-reply@calex.example.tld
      # optional, default is "calex"
      # - EMAIL_NAME=calex
    expose:
      - "4000"
    depends_on:
      - calex-db

  calex-db:
    image: postgres:17
    container_name: calex-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=calex
    restart: always
    volumes:
      - ./data:/var/lib/postgresql/data
