stages:
  - test
  - publish

# Never run this project's CI on a fork. Fork MR pipelines in the parent
# project are also disabled in GitLab settings.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PROJECT_PATH != "shibaobun/calex"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  MIX_ENV: test
  HOST: testing.example.tld
  MIX_HOME: $CI_PROJECT_DIR/.mix
  MIX_ARCHIVES: $CI_PROJECT_DIR/.mix/archives
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  TEST_DATABASE_URL: ecto://postgres:postgres@postgres/calex_test

test:
  stage: test
  interruptible: true
  # elixir:1.20.5-otp-29
  image: hexpm/elixir:1.20.5-erlang-29.1.2-alpine-3.24.3
  services:
    - postgres:17
  rules:
    - when: on_success
  cache:
    key:
      files:
        - mix.lock
    paths:
      - _build
      - deps
      - .mix
  before_script:
    - apk add --no-cache build-base git
    - mix local.hex --force 2.6.0
    - mix local.rebar rebar3 https://github.com/erlang/rebar3/releases/download/3.28.0/rebar3 --force --sha512 33bbd38c624f179a507ea0db611217aa3e9d99b6e65a96cdaebd933224e73af271c4d348171698f69c907dcf4f246757c8ea925a4153048bfdb6c7c5ca0835cf
    - mix deps.get
  script:
    - mix test

.publish:
  stage: publish
  interruptible: true
  image: docker:28-cli
  timeout: 6 hours
  services:
    - name: docker:28-dind
      command: ["--tls=false", "--dns", "192.168.0.1"]
  variables:
    FF_NETWORK_PER_BUILD: "true"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - apk add --no-cache curl jq
    - |
      skip_if_superseded() {
        [ -z "$CI_COMMIT_BRANCH" ] && return 0
        tip=$(curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_BRANCH" \
          | jq -r '.id // empty' || true)
        if [ -n "$tip" ] && [ "$tip" != "$CI_COMMIT_SHA" ]; then
          echo "Skipping publish: $CI_COMMIT_BRANCH is $tip, this pipeline is $CI_COMMIT_SHA"
          exit 0
        fi
      }
      skip_if_superseded
      for i in $(seq 1 30); do
        docker info && break
        echo "waiting for docker-in-docker ($i/30)"
        sleep 2
      done
      docker info || {
        echo "docker-in-docker did not become ready"
        echo "nested docker-in-docker did not listen on tcp://docker:2375"
        exit 1
      }
      echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      docker run --rm --privileged tonistiigi/binfmt --install all
      docker buildx create --name "multiarch-$CI_JOB_ID" --driver docker-container --use
      skip_if_superseded
      docker buildx build --push --platform linux/amd64,linux/arm64 -t "$IMAGE_TAG" .
      docker buildx rm "multiarch-$CI_JOB_ID" || true

publish-stable:
  extends: .publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PROJECT_PATH == "shibaobun/calex" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "stable" && $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    IMAGE_TAG: shibaobun/calex:latest

publish-dev:
  extends: .publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PROJECT_PATH == "shibaobun/calex" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev" && $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    IMAGE_TAG: shibaobun/calex:dev

publish-tag:
  extends: .publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PROJECT_PATH == "shibaobun/calex" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
  variables:
    IMAGE_TAG: shibaobun/calex:$CI_COMMIT_TAG
